<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Background with rounded corners for maskable safe-zone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Center Emblem Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Architectural / Civic Pediment Roof -->
    <path d="M256 120 L136 185 L376 185 Z" fill="url(#goldGrad)" />
    
    <!-- Arch / Pillars -->
    <rect x="155" y="195" width="26" height="120" rx="4" fill="#ffffff" />
    <rect x="202" y="195" width="26" height="120" rx="4" fill="#ffffff" />
    <rect x="250" y="195" width="26" height="120" rx="4" fill="#ffffff" />
    <rect x="297" y="195" width="26" height="120" rx="4" fill="#ffffff" />
    <rect x="344" y="195" width="26" height="120" rx="4" fill="#ffffff" />
    
    <!-- Base Foundation Steps -->
    <rect x="130" y="320" width="266" height="18" rx="4" fill="url(#goldGrad)" />
    <rect x="110" y="342" width="306" height="24" rx="6" fill="#ffffff" />
  </g>

  <!-- Organization Initials & Year -->
  <text x="256" y="420" font-family="'Hind Siliguri', 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    পাটগ্রাম কল্যাণ সমিতি
  </text>
  <text x="256" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#fde047" text-anchor="middle" letter-spacing="2">
    ESTD 2000 · RANGPUR
  </text>
</svg>
